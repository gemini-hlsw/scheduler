overwrite: true
schema:
  - "https://weather-graphql-ec26c2063b75.herokuapp.com/"
  - "../backend/scheduler.graphql"
documents: "src/**/*.{ts,tsx}"
generates:
  src/gql/:
    preset: client
    presetConfig:
      # Fragments only share selections between queries (NightPlansFields), so
      # their fields stay readable on the result without useFragment.
      fragmentMasking: false
    config:
      withHooks: true
      enumsAsTypes: true
      futureProofEnums: true
ignoreNoDocuments: true
