[project]
name = "scheduler"
version = "2026.10.2"
description = "Gemini Observatory automated scheduler"
readme = 'README.md'
authors = [{ name = "NOIRLab" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "astropy>=7.1.0",
    "fastapi>=0.116.1",
    "gelidum>=0.5.9",
    "gql>=4.0.0",
    "hypothesis>=6.137.1",
    "lucupy>=0.2.20",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=6.4.0",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.31.0",
    "alembic>=1.18.3",
    "pydantic-settings>=2.12.0",
    "greenlet>=3.3.1",
    "scipy>=1.16.1",
    "sortedcontainers>=2.4.0",
    "stamina>=26.1.0",
    "strawberry-graphql[fastapi]>=0.278.1",
    "uvicorn[standard]>=0.35.0",
    "opentelemetry-distro[otlp]>=0.65b0",
]

[dependency-groups]
gpp-prod = ["gpp-client==26.10.4"]
# Dev tracks the latest .dev release; When new cycle starts, bump the CalVer
gpp-dev = ["gpp-client>=26.10.7.dev1,==26.10.7.*,!=26.10.7"]
dev = [
    "hypothesis>=6.137.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
    "strawberry-graphql[cli]>=0.278.1",
    "towncrier>=25.8.0",
    "ty>=0.0.29",
]
docs = [
    "mkdocs-material>=9.6.16",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-include-markdown-plugin>=7.0.0",
    "mkdocstrings-python>=1.16.12",
]

[tool.uv]
conflicts = [
    [{ group = "gpp-prod" }, { group = "gpp-dev" }],
]


# Towncrier config moved to towncrier.toml at the repo root so it is
# picked up when towncrier runs from the root (where changelog.d/ lives).

[tool.ruff]
line-length = 120

[tool.ruff.format]
# Keep the quotes already in the code instead of rewriting them all to double quotes.
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
# Packages re-export their modules' public names with `from .module import *`,
# each module declaring what it exports through `__all__`.
"__init__.py" = ["F403"]
